name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java for release-package fixture
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Resolve dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Windows Debug package with MSVC
        run: flutter build windows --debug

      - name: Build and run native transport regressions with MSVC
        run: |
          cmake --build build/windows/x64 --config Debug --target wire_protocol_test audio_mixer_test system_capture_integration_test
          $wireTest = Get-ChildItem build/windows/x64 -Recurse -Filter wire_protocol_test.exe | Select-Object -First 1
          $mixerTest = Get-ChildItem build/windows/x64 -Recurse -Filter audio_mixer_test.exe | Select-Object -First 1
          $integrationTest = Get-ChildItem build/windows/x64 -Recurse -Filter system_capture_integration_test.exe | Select-Object -First 1
          if (-not $wireTest -or -not $mixerTest -or -not $integrationTest) {
            throw 'Native regression executables were not produced.'
          }
          & $wireTest.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mixerTest.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $integrationTest.DirectoryName
          try {
            & $integrationTest.FullName --expect-handshake-stop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $integrationTest.FullName --expect-handshake-error
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $integrationTest.FullName --expect-disconnect-error
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Install pinned Android tools for package verification
        working-directory: .
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            "platforms;android-36" "build-tools;36.1.0"

      - name: Verify checked-in Debug companion identity
        working-directory: .
        run: |
          $apk = '.\client\assets\android\audioshare-companion-poc-debug.apk'
          $analyzer = "$env:ANDROID_HOME\cmdline-tools\latest\bin\apkanalyzer.bat"
          $package = & $analyzer manifest application-id $apk
          $version = & $analyzer manifest version-code $apk
          if ($package -cne 'com.audioshare.usbcompanion.debug') {
            throw "Wrong Debug companion package: '$package'."
          }
          if ([int] $version -ne 6) {
            throw "Wrong Debug companion version code: '$version'."
          }

      - name: Create ephemeral CI-only signed companion
        working-directory: .
        run: |
          .\tools\new_ci_companion_fixture.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'audioshare-ci-companion')

      - name: Prove wrong companion signer is rejected
        working-directory: .
        run: |
          $accepted = $false
          try {
            .\tools\verify_companion_apk.ps1 `
              -Apk $env:AUDIOSHARE_COMPANION_APK `
              -ExpectedPackage 'com.audioshare.usbcompanion' `
              -ExpectedVersionCode 6 `
              -ExpectedCertificateSha256 ('0' * 64)
            $accepted = $true
          } catch {
            if ($_.Exception.Message -notlike 'Wrong companion signing certificate*') {
              throw
            }
          }
          if ($accepted) { throw 'Wrong companion signer unexpectedly passed verification.' }

      - name: Prove too-new companion version is rejected
        working-directory: .
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'audioshare-too-new-companion'
          .\tools\new_ci_companion_fixture.ps1 `
            -OutputDirectory $directory `
            -GithubEnvironmentFile '' `
            -VersionCode 7
          $accepted = $false
          try {
            .\tools\verify_companion_apk.ps1 `
              -Apk (Join-Path $directory 'companion-ci-signed.apk') `
              -ExpectedPackage 'com.audioshare.usbcompanion' `
              -ExpectedVersionCode 6 `
              -ExpectedCertificateSha256 ('0' * 64)
            $accepted = $true
          } catch {
            if ($_.Exception.Message -notlike 'Wrong companion version code*') {
              throw
            }
          }
          if ($accepted) { throw 'Too-new companion unexpectedly passed verification.' }

      - name: Build and verify Windows Release package
        run: |
          flutter build windows --release
          ..\tools\package_windows_release.ps1 `
            -BundleDirectory .\build\windows\x64\runner\Release `
            -OutputZip (Join-Path $env:RUNNER_TEMP 'AudioShare-Windows-CI-only.zip')

      - name: Prove release APK inputs do not persist in CMake cache
        run: |
          Remove-Item Env:AUDIOSHARE_COMPANION_APK -ErrorAction SilentlyContinue
          Remove-Item Env:AUDIOSHARE_COMPANION_CERT_SHA256 -ErrorAction SilentlyContinue
          flutter build windows --debug
          $cache = Get-Content .\build\windows\x64\CMakeCache.txt
          if (-not ($cache -match '^AUDIOSHARE_COMPANION_APK:FILEPATH=$')) {
            throw 'Companion APK path remained in CMake cache after its input was removed.'
          }
          if (-not ($cache -match '^AUDIOSHARE_COMPANION_CERT_SHA256:STRING=$')) {
            throw 'Companion certificate remained in CMake cache after its input was removed.'
          }
